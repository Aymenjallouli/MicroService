<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Upload Factures CSV</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        h1, h2 {
            color: #2c3e50;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2980b9;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            background-color: #f8f9fa;
            border-left: 5px solid #28a745;
            display: none;
        }
        .error {
            border-left: 5px solid #dc3545;
        }
        .template-link {
            margin-top: 20px;
            display: block;
        }
        .card {
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            margin-top: 20px;
        }
        .card h3 {
            margin-top: 0;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gestion des Factures</h1>
        
        <div class="card">
            <h3>Importer des factures</h3>
            <div class="form-group">
                <label for="csvFile">Sélectionnez un fichier CSV :</label>
                <input type="file" id="csvFile" accept=".csv">
            </div>

            <button id="uploadBtn">Télécharger et traiter</button>
            <a href="/api/factures/template" class="template-link">Télécharger un fichier template</a>
        </div>
        
        <div class="card">
            <h3>Générer une facture depuis une dépense</h3>
            <div class="form-group">
                <label for="depenseId">ID de la dépense :</label>
                <input type="number" id="depenseId">
            </div>

            <button id="generateBtn">Générer la facture</button>
        </div>

        <div id="result"></div>
    </div>

    <script>
        document.getElementById('uploadBtn').addEventListener('click', async () => {
            const fileInput = document.getElementById('csvFile');
            const resultDiv = document.getElementById('result');
            
            if (!fileInput.files || fileInput.files.length === 0) {
                resultDiv.textContent = "Veuillez sélectionner un fichier";
                resultDiv.classList.add('error');
                resultDiv.style.display = 'block';
                return;
            }
            
            const file = fileInput.files[0];
            if (!file.name.endsWith('.csv')) {
                resultDiv.textContent = "Le fichier doit être au format CSV";
                resultDiv.classList.add('error');
                resultDiv.style.display = 'block';
                return;
            }
            
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                const response = await fetch('/api/factures/upload-file', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    resultDiv.classList.remove('error');
                    resultDiv.textContent = `${result.message} - ${result.invoiceCount} factures importées`;
                    resultDiv.style.display = 'block';
                } else {
                    resultDiv.classList.add('error');
                    resultDiv.textContent = result.message || "Erreur lors de l'importation";
                    resultDiv.style.display = 'block';
                }
            } catch (error) {
                resultDiv.classList.add('error');
                resultDiv.textContent = `Erreur: ${error.message}`;
                resultDiv.style.display = 'block';
            }
        });
        
        document.getElementById('generateBtn').addEventListener('click', async () => {
            const depenseIdInput = document.getElementById('depenseId');
            const resultDiv = document.getElementById('result');
            
            if (!depenseIdInput.value) {
                resultDiv.textContent = "Veuillez entrer un ID de dépense";
                resultDiv.classList.add('error');
                resultDiv.style.display = 'block';
                return;
            }
            
            try {
                const response = await fetch(`/api/factures/generate-from-depense/${depenseIdInput.value}`, {
                    method: 'POST'
                });
                
                if (response.ok) {
                    const result = await response.json();
                    resultDiv.classList.remove('error');
                    resultDiv.textContent = `Facture générée avec succès: ${result.numero} pour un montant de ${result.montant}`;
                    resultDiv.style.display = 'block';
                } else {
                    const error = await response.text();
                    resultDiv.classList.add('error');
                    resultDiv.textContent = error || "Erreur lors de la génération de la facture";
                    resultDiv.style.display = 'block';
                }
            } catch (error) {
                resultDiv.classList.add('error');
                resultDiv.textContent = `Erreur: ${error.message}`;
                resultDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
