spring.application.name=taskssch-service

# Server configuration
server.port=8092

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:taskdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate / JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Hibernate logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Eureka client configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Project service direct URL (uncomment if Eureka is not working)
project-service.url=http://localhost:8079

# Mission service direct URL (use when Eureka is not working properly)
mission-service.url=http://localhost:8091

# Feign client configuration
feign.client.config.default.connectTimeout=10000
feign.client.config.default.readTimeout=10000
feign.compression.request.enabled=true
feign.compression.response.enabled=true

# Feign circuit breaker configuration - disabled as per request
feign.circuitbreaker.enabled=false
# feign.circuitbreaker.alphanumeric-ids.enabled=true

# Logging for Feign client troubleshooting
logging.level.com.example.financeservice.FeignClient.ProjectClient=DEBUG

# Use MappingJackson2HttpMessageConverter for better JSON handling
spring.mvc.converters.preferred-json-mapper=jackson

# Enable component scanning
spring.main.allow-bean-definition-overriding=true
spring.cloud.config.enabled=false

# Enhanced logging configuration
logging.level.com.example.financeservice.service=DEBUG
logging.level.com.example.financeservice.FeignClient=TRACE
logging.level.feign=DEBUG

# Detailed Feign client logging
feign.client.config.default.loggerLevel=FULL

# File upload settings
spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=16MB
spring.servlet.multipart.enabled=true

# Scheduler configuration
spring.task.scheduling.pool.size=5
# Set to true to wait for scheduled tasks to complete on context close
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=10s

# Cloudinary configuration (replace with your own values or use environment variables)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
